[package]
name = "hyprselector"
version = "0.1.0"
edition = "2024"
description = "Keyboard-driven window hints for Hyprland Lua sessions"
rust-version = "1.89"
license = "MIT"

[dependencies]
anyhow = "1"
calloop = "0.14"
calloop-wayland-source = "0.4"
fontdue = "0.9"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
smithay-client-toolkit = "0.21.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
